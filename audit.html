<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MDC | Request Strategic Audit</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .audit-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15vh 4vw;
            position: relative;
            background: var(--bg-card);
        }
    </style>
</head>
<body>

    <!-- NAV -->
    <nav id="navbar">
        <a href="index.html" class="logo" style="text-decoration: none;">
            MDC.
        </a>
    </nav>

    <!-- AUDIT INTAKE FORM -->
    <main class="audit-container">
        <!-- Floating Arabic Background Accent -->
        <div class="bg-accent-arabic" style="top: -5vh; right: -5vw; font-size: 30vw; opacity: 0.02;">استراتيجية</div>

        <div style="position: relative; z-index: 2; width: 100%; max-width: 600px; text-align: center;">
            <span class="tag-accent" style="justify-content: center;">Exclusive Intake</span>
            <h1 class="massive-text" style="font-size: clamp(2.5rem, 6vw, 4rem); margin-bottom: 20px; color: var(--text-primary);">Request Strategic<br><span style="color: var(--accent-orange);">Audit</span></h1>
            <p style="color: var(--text-secondary); margin-bottom: 40px; font-size: 1.1rem; max-width: 500px; margin: 0 auto 40px;">
                Submit your domain. Our team will review your architecture and return a brutally honest tactical audit to your inbox. 
            </p>

            <form action="https://formspree.io/f/YOUR_FORMSPREE_ID" method="POST" class="contact-form" style="margin-top: 0;">
                <input type="text" name="name" class="form-input" placeholder="Your Name or Brand" required>
                <input type="email" name="email" class="form-input" placeholder="Email Address" required>
                <input type="text" name="domain" class="form-input" placeholder="Current Domain (URL)">
                <textarea name="message" class="form-input" placeholder="What are we outmaneuvering?"></textarea>
                
                <button type="submit" class="btn" style="border: 1px solid var(--accent-orange); background: transparent; color: var(--text-primary); margin-top: 10px; cursor: pointer; width: 100%;">Submit Inquiry</button>
            </form>
            
            <a href="onboarding.html" style="display: inline-block; color: var(--text-secondary); margin-top: 30px; text-decoration: none; font-size: 0.9rem; border-bottom: 1px solid var(--border); padding-bottom: 2px; transition: color 0.3s;">Prefer to bypass the inquiry? Retain our services immediately via Stripe.</a>
        </div>
    </main>

</body>
</html>
